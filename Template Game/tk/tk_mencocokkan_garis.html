<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubungkan Garis Ceria TK</title>
    <style>
        body { font-family: 'Comic Sans MS', sans-serif; background-color: #fce4ec; text-align: center; margin: 0; padding: 20px; }
        .game-container { background: white; max-width: 480px; margin: auto; padding: 20px; border-radius: 25px; border: 5px solid #f48fb1; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .header-info { background: #fce4ec; padding: 6px 14px; border-radius: 15px; font-size: 0.85rem; color: #c2185b; margin-bottom: 15px; font-weight: bold; }
        .row-match { display: flex; justify-content: space-between; margin: 20px 0; align-items: center; }
        .tk-box { background: #fff5f8; border: 4px solid #f8bbd0; font-size: 2.8rem; width: 90px; height: 90px; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 20px; cursor: pointer; transition: 0.2s; }
        .tk-label { font-size: 0.75rem; font-weight: bold; color: #888; margin-top: 2px; }
        .tk-box.selected { background: #f8bbd0; border-color: #e91e63; animation: pulse 0.5s infinite alternate; }
        .tk-box.done { background: #e8f5e9; border-color: #4caf50; pointer-events: none; opacity: 0.6; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
        .garis-tengah { font-size: 1.5rem; color: #f48fb1; }
        /* === FEEDBACK PANEL === */
        .feedback-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:9999; align-items:center; justify-content:center; }
        .feedback-overlay.show { display:flex; }
        .feedback-card { background:#fff; border-radius:32px; padding:36px 40px 28px; text-align:center; max-width:320px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,0.25); animation: popIn .3s cubic-bezier(.34,1.56,.64,1); }
        .feedback-emoji { font-size:5rem; line-height:1; margin-bottom:12px; display:block; animation: bounce 0.5s ease infinite alternate; }
        .feedback-msg { font-size:1.35rem; font-weight:900; margin-bottom:6px; }
        .feedback-sub { font-size:0.95rem; color:#777; margin-bottom:20px; }
        .feedback-btn { border:none; padding:12px 36px; border-radius:50px; font-size:1rem; font-weight:800; cursor:pointer; color:#fff; background:linear-gradient(135deg,#f093fb,#f5576c); }
        @keyframes popIn  { from{transform:scale(.5);opacity:0} to{transform:scale(1);opacity:1} }
        @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-10px)} }
    </style>
</head>
<body>

<div class="game-container" id="gameScreen">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <div class="header-info" id="teacherBadge" style="margin-bottom:0;">Guru: - | Kelas: -</div>
        <button class="btn-mute" id="btnMute" onclick="toggleMute()" style="background:#fce4ec; border:1.5px solid #f48fb1; color:#c2185b; padding:4px 12px; border-radius:20px; font-weight:bold; cursor:pointer; font-size:0.8rem;">🔊 Suara: On</button>
    </div>
    <h2 id="gameTitle">🌸 Hubungkan Garis 🌸</h2>
    <p style="color: #c2185b; font-weight: bold;">Klik gambar di kiri, lalu klik pasangannya di kanan!</p>
    
    <div id="papanBermain"></div>
</div>

<div class="feedback-overlay" id="feedbackOverlay">
  <div class="feedback-card">
    <span class="feedback-emoji" id="feedbackEmoji">😢</span>
    <div class="feedback-msg" id="feedbackMsg">Ups, Belum Pas!</div>
    <div class="feedback-sub" id="feedbackSub">Coba hubungkan lagi ya!</div>
    <button class="feedback-btn" id="feedbackBtn" onclick="closeFeedback()">Coba Lagi 🔄</button>
  </div>
</div>

<script>
    const dataGame = {{DATA_GAME_JSON}} || {
        "judul": "Hubungkan Garis Ceria",
        "nama_guru": "Ibu Guru",
        "wali_kelas": "Wali Kelas",
        "kelas": "TK-A",
        "cocok_tk": [
            {"id": "A", "hewan": "🐵 Monyet", "makanan": "🍌 Pisang"},
            {"id": "B", "hewan": "🐰 Kelinci", "makanan": "🥕 Wortel"},
            {"id": "C", "hewan": "🐱 Kucing", "makanan": "🐟 Ikan"}
        ]
    };

    let selectedLeftId = null;
    let matchSuccessCount = 0;

    function initHeader() {
        if(dataGame.judul) document.getElementById('gameTitle').innerText = '🌸 ' + dataGame.judul + ' 🌸';
        if(dataGame.nama_guru || dataGame.kelas) {
            document.getElementById('teacherBadge').innerText = `👩‍🏫 Guru: ${dataGame.nama_guru || '-'} | 📚 ${dataGame.kelas || '-'} (Wali Kelas: ${dataGame.wali_kelas || '-'})`;
        }
    }

    function buildGame() {
        initHeader();
        updateMuteBtn();
        const papan = document.getElementById('papanBermain');
        let makananAcak = [...dataGame.cocok_tk].sort(() => Math.random() - 0.5);

        for (let i = 0; i < dataGame.cocok_tk.length; i++) {
            let baris = document.createElement('div');
            baris.className = 'row-match';
            
            let hParts = dataGame.cocok_tk[i].hewan.split(" ");
            let mParts = makananAcak[i].makanan.split(" ");

            baris.innerHTML = `
                <div class="tk-box left-tk" id="H-${dataGame.cocok_tk[i].id}" onclick="klikHewan('${dataGame.cocok_tk[i].id}')">
                    <span>${hParts[0]}</span>
                    <span class="tk-label">${hParts[1] || ''}</span>
                </div>
                <div class="garis-tengah">➔</div>
                <div class="tk-box right-tk" id="M-${makananAcak[i].id}" onclick="klikMakanan('${makananAcak[i].id}')">
                    <span>${mParts[0]}</span>
                    <span class="tk-label">${mParts[1] || ''}</span>
                </div>
            `;
            papan.appendChild(baris);
        }
    }

    let _idVoice = null;
    function loadVoice() {
        if (!('speechSynthesis' in window)) return;
        const voices = window.speechSynthesis.getVoices();
        _idVoice = voices.find(v => (v.lang && v.lang.toLowerCase().startsWith('id')) || (v.name && v.name.toLowerCase().includes('indonesia'))) || null;
    }
    if ('speechSynthesis' in window) {
        loadVoice();
        window.speechSynthesis.onvoiceschanged = loadVoice;
    }

    let isMuted = localStorage.getItem('wg_sound_muted') === 'true';

    function updateMuteBtn() {
        const btn = document.getElementById('btnMute');
        if (btn) {
            btn.innerHTML = isMuted ? '🔇 Suara: Off' : '🔊 Suara: On';
            btn.style.background = isMuted ? '#ffebee' : '#fce4ec';
            btn.style.color = isMuted ? '#c62828' : '#c2185b';
            btn.style.borderColor = isMuted ? '#ef9a9a' : '#f48fb1';
        }
    }

    function toggleMute() {
        isMuted = !isMuted;
        localStorage.setItem('wg_sound_muted', isMuted);
        updateMuteBtn();
        if (isMuted && window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function bacaTeks(teks) {
        if (isMuted || !teks) return;
        let cleanText = teks.replace(/🌸|🐶|🐱|🐭|🐰|🦊|🐻|🐼|🐯|🦁|🐮|🐷|🐸|🐒|🐔|🐧|🐦|🐤|🦆|🦅|🦉|🦇|🐺|🐗|🐴|🦄|🐝|🐛|🦋|🐌|🐞|🐜|🦟|🦗|🕷️|🦂|🐍|🦎|🦖|🦕|🐙|🦑|🦐|🦞|🦀|🐡|🐠|🐟|🐬|🐳|🐋|🦈|🐊|🐅|leopard|🦓|🦍|🦧|🦣|🐘|🦛|🦏|🐪|🐫|🦒|🦘|🦬|🐃|🐂|🐄|🐎|🐖|🐏|🐑|🦙|🐐|🦌|🐕|🐩|🦺|🐈|🐓|🦃|🦚|parrot|🦩|🕊️|🐇|🦝|🦨|🦡|🦫|🦦|🦥|🦔|🐿️|🦘|🦡/g, '').trim();
        let url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=id&q=" + encodeURIComponent(cleanText || teks);
        let audio = new Audio(url);
        audio.play().catch(() => {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            let u = new SpeechSynthesisUtterance(cleanText || teks);
            u.lang = 'id-ID';
            if (_idVoice) u.voice = _idVoice;
            u.rate = 0.85;
            window.speechSynthesis.speak(u);
        });
    }

    function klikHewan(id) {
        document.querySelectorAll('.left-tk').forEach(b => b.classList.remove('selected'));
        selectedLeftId = id;
        const itemObj = dataGame.cocok_tk.find(p => p.id == id);
        if (itemObj) bacaTeks(itemObj.hewan);
        document.getElementById(`H-${id}`).classList.add('selected');
    }

    function klikMakanan(id) {
        if (selectedLeftId === null) return;

        if (selectedLeftId === id) {
            document.getElementById(`H-${id}`).className = "tk-box done";
            document.getElementById(`M-${id}`).className = "tk-box done";
            matchSuccessCount++;
            selectedLeftId = null;
            
            if (matchSuccessCount === dataGame.cocok_tk.length) {
                setTimeout(() => {
                    document.getElementById('gameScreen').innerHTML = "<h2 style='color:#4caf50; font-size:2rem;'>🎉 YAY BERHASIL! 🎉</h2><p style='font-size:1.2rem;'>Semua pasangan berhasil dihubungkan!</p>";
                }, 800);
            }
        } else {
            showFeedback(false, function() {
                document.querySelectorAll('.left-tk').forEach(b => b.classList.remove('selected'));
                selectedLeftId = null;
            });
        }
    }

    let _cb = null;
    function showFeedback(isCorrect, callback) {
        _cb = callback || null;
        const ov = document.getElementById('feedbackOverlay');
        document.getElementById('feedbackEmoji').textContent = isCorrect
            ? ['🎉','⭐','🌟','🏆','🥳'][Math.floor(Math.random()*5)]
            : ['😢','😅','🙈','😬','💪'][Math.floor(Math.random()*5)];
        document.getElementById('feedbackMsg').textContent  = isCorrect ? 'Horee! Benar! 🎊' : 'Ups, Kurang Pas...';
        document.getElementById('feedbackSub').textContent  = isCorrect ? 'Pasangannya cocok sekali!' : 'Yuk coba cari pasangan lain! 💪';
        document.getElementById('feedbackBtn').textContent  = isCorrect ? 'Lanjut ➡️' : 'Coba Lagi 🔄';
        document.getElementById('feedbackBtn').style.background = isCorrect ? 'linear-gradient(135deg,#43e97b,#38f9d7)' : 'linear-gradient(135deg,#f093fb,#f5576c)';
        ov.classList.add('show');
    }
    function closeFeedback() {
        document.getElementById('feedbackOverlay').classList.remove('show');
        if (_cb) { _cb(); _cb = null; }
    }

    buildGame();
</script>
</body>
</html>
