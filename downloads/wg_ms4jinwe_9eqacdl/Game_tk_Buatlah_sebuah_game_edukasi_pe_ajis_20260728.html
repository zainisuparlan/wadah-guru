<!DOCTYPE html>
<html lang="id">
<head>
  <!-- ═══ INFO GAME ═══ -->
  <meta name="game-creator" content="ajis">
  <meta name="game-class" content="tk">
  <meta name="game-homeroom" content="nonik">
  <meta name="generator" content="Wadah Guru AI - by Zaini Suparlan">
  <!-- ════════════════ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detektif Suara TK</title>
    <style>
        body { font-family: 'Comic Sans MS', sans-serif; background-color: #e0f7fa; text-align: center; margin: 0; padding: 20px; }
        .game-container { background: white; max-width: 500px; margin: auto; padding: 30px; border-radius: 25px; border: 5px solid #4dd0e1; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .header-info { background: #e0f7fa; padding: 6px 14px; border-radius: 15px; font-size: 0.85rem; color: #00796b; margin-bottom: 12px; font-weight: bold; }
        .btn-sound { background: #ff4081; border: none; color: white; padding: 15px 30px; font-size: 1.3rem; font-weight: bold; border-radius: 50px; cursor: pointer; margin: 20px 0; box-shadow: 0 5px #c2185b; }
        .btn-sound:active { transform: translateY(4px); box-shadow: none; }
        .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .choice-btn { background: #f5f5f5; border: 3px solid #b2ebf2; border-radius: 20px; padding: 20px; font-size: 3.5rem; cursor: pointer; transition: 0.2s; }
        .choice-btn:hover { background: #e0f7fa; transform: scale(1.05); }
        /* === FEEDBACK PANEL === */
        .feedback-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:9999; align-items:center; justify-content:center; }
        .feedback-overlay.show { display:flex; }
        .feedback-card { background:#fff; border-radius:32px; padding:36px 40px 28px; text-align:center; max-width:320px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,0.25); animation: popIn .3s cubic-bezier(.34,1.56,.64,1); }
        .feedback-emoji { font-size:5rem; line-height:1; margin-bottom:12px; display:block; animation: bounce 0.5s ease infinite alternate; }
        .feedback-msg { font-size:1.35rem; font-weight:900; margin-bottom:6px; }
        .feedback-sub { font-size:0.95rem; color:#777; margin-bottom:20px; }
        .feedback-btn { border:none; padding:12px 36px; border-radius:50px; font-size:1rem; font-weight:800; cursor:pointer; color:#fff; }
        .feedback-btn.correct { background:linear-gradient(135deg,#43e97b,#38f9d7); }
        .feedback-btn.wrong   { background:linear-gradient(135deg,#f093fb,#f5576c); }
        @keyframes popIn  { from{transform:scale(.5);opacity:0} to{transform:scale(1);opacity:1} }
        @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-10px)} }
    </style>

<style id="watermark-style-zaini">
  #watermark-zaini-suparlan {
    position: fixed !important;
    bottom: 10px !important;
    right: 15px !important;
    z-index: 99999 !important;
    font-family: 'Segoe UI', Arial, sans-serif !important;
    font-size: 11px !important;
    font-weight: 600 !important;
    color: rgba(80, 80, 80, 0.65) !important;
    letter-spacing: 0.5px !important;
    pointer-events: none !important;
    user-select: none !important;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8) !important;
    border-top: 1px solid rgba(120,120,120,0.2) !important;
    padding-top: 4px !important;
    padding-left: 8px !important;
    padding-right: 8px !important;
    background: rgba(255,255,255,0.4) !important;
    border-radius: 6px 6px 0 0 !important;
    backdrop-filter: blur(4px) !important;
  }
</style>

</head>
<body>

<div class="game-container" id="gameScreen">
    <div class="header-info" id="teacherBadge">Guru: - | Kelas: -</div>
    <h2 id="gameTitle">🔍 Detektif Suara Misterius 🔍</h2>
    <p style="color: #00796b;">Klik tombol pink untuk mendengar suaranya, lalu tebak siapa aku!</p>
    
    <button class="btn-sound" onclick="putarSuara()">🔊 DENGAR SUARA</button>
    
    <div class="choice-grid" id="choicesBox">
        <!-- Pilihan hewan -->
    </div>
</div>

<div class="feedback-overlay" id="feedbackOverlay">
  <div class="feedback-card">
    <span class="feedback-emoji" id="feedbackEmoji">🎉</span>
    <div class="feedback-msg" id="feedbackMsg">Hore!</div>
    <div class="feedback-sub" id="feedbackSub">Kamu benar!</div>
    <button class="feedback-btn" id="feedbackBtn" onclick="closeFeedback()">Lanjut ➡️</button>
  </div>
</div>

<script>
    const dataGame = {
  "judul": "Petualangan di Hutan Ajaib",
  "nama_guru": "ajis",
  "wali_kelas": "nonik",
  "kelas": "tk",
  "soal_suara": [
    {
      "suara_teks": "Dengarkan suara ini, seperti ada yang sedang bernyanyi dengan suara yang manis dan tinggi. Apa suara itu?",
      "pilihan": [
        "🐦",
        "🐝",
        "🌊",
        "🐝"
      ],
      "jawaban": "🐦"
    },
    {
      "suara_teks": "Apa suara yang kamu dengar ketika ada daun yang jatuh ke tanah?",
      "pilihan": [
        "🌟",
        "🌿",
        "💧",
        "🍂"
      ],
      "jawaban": "🍂"
    },
    {
      "suara_teks": "Kamu sedang berjalan di dekat sungai, apa suara yang kamu dengar?",
      "pilihan": [
        "🌊",
        "🐝",
        "🌴",
        "🏠"
      ],
      "jawaban": "🌊"
    },
    {
      "suara_teks": "Apa suara yang kamu dengar ketika seekor kupu-kupu sedang terbang?",
      "pilihan": [
        "🦋",
        "🐝",
        "🌟",
        "🌿"
      ],
      "jawaban": "🦋"
    },
    {
      "suara_teks": "Kamu sedang bermain di taman, apa suara yang kamu dengar ketika ada anak-anak yang sedang berlari?",
      "pilihan": [
        "🏃‍♀️",
        "🌳",
        "🌴",
        "🐝"
      ],
      "jawaban": "🏃‍♀️"
    },
    {
      "suara_teks": "Apa suara yang kamu dengar ketika hujan turun?",
      "pilihan": [
        "⛈️",
        "🌞",
        "🌻",
        "🐝"
      ],
      "jawaban": "⛈️"
    }
  ]
} || {
        "judul": "Detektif Suara Misterius",
        "nama_guru": "Ibu Guru",
        "wali_kelas": "Wali Kelas",
        "kelas": "TK-A",
        "soal_suara": [
            {"suara_teks": "Mooo! Mooo! Aku suka makan rumput dan menghasilkan susu.", "pilihan": ["🐱", "🐮", "🐔", "🦆"], "jawaban": "🐮"},
            {"suara_teks": "Petok petok petok! Aku bertelur setiap pagi.", "pilihan": ["🦁", "🐸", "🐔", "🐵"], "jawaban": "🐔"}
        ]
    };

    let currentIndex = 0;

    function initHeader() {
        if(dataGame.judul) document.getElementById('gameTitle').innerText = '🔍 ' + dataGame.judul + ' 🔍';
        if(dataGame.nama_guru || dataGame.kelas) {
            document.getElementById('teacherBadge').innerText = `👩‍🏫 Guru: ${dataGame.nama_guru || '-'} | 📚 ${dataGame.kelas || '-'} (Wali Kelas: ${dataGame.wali_kelas || '-'})`;
        }
    }

    function putarSuara() {
        if(!dataGame.soal_suara || !dataGame.soal_suara[currentIndex]) return;
        let teks = dataGame.soal_suara[currentIndex].suara_teks;
        let suaraRobot = new SpeechSynthesisUtterance(teks);
        suaraRobot.lang = 'id-ID';
        window.speechSynthesis.speak(suaraRobot);
    }

    function loadRound() {
        if (currentIndex >= dataGame.soal_suara.length) {
            document.getElementById('gameScreen').innerHTML = "<h2 style='color:#4caf50;'>🎉 KAMU HEBAT! 🎉</h2><p style='font-size:1.2rem;'>Telingamu sangat tajam mendengarkan rahasia suara!</p>";
            return;
        }

        const currentData = dataGame.soal_suara[currentIndex];
        const box = document.getElementById('choicesBox');
        box.innerHTML = "";

        currentData.pilihan.forEach(emoji => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = emoji;
            btn.onclick = () => checkAnswer(emoji);
            box.appendChild(btn);
        });

        setTimeout(putarSuara, 500);
    }

    function checkAnswer(pilihanEmoji) {
        const jawabanBenar = dataGame.soal_suara[currentIndex].jawaban;
        if (pilihanEmoji === jawabanBenar) {
            showFeedback(true, function() { currentIndex++; loadRound(); });
        } else {
            showFeedback(false);
        }
    }

    let _cb = null;
    function showFeedback(isCorrect, callback) {
        _cb = callback || null;
        const ov = document.getElementById('feedbackOverlay');
        document.getElementById('feedbackEmoji').textContent = isCorrect
            ? ['💖','🎉','⭐','🌟','🏆'][Math.floor(Math.random()*5)]
            : ['😢','😅','🙈','😬','💪'][Math.floor(Math.random()*5)];
        document.getElementById('feedbackMsg').textContent  = isCorrect ? 'Luar Biasa Benar! 💖' : 'Ups, Belum Tepat...';
        document.getElementById('feedbackSub').textContent  = isCorrect ? 'Tebakan suaramu hebat sekali!' : 'Yuk dengarkan suaranya baik-baik lagi! 🔊';
        document.getElementById('feedbackBtn').textContent  = isCorrect ? 'Lanjut ➡️' : 'Coba Lagi 🔄';
        document.getElementById('feedbackBtn').className    = isCorrect ? 'feedback-btn correct' : 'feedback-btn wrong';
        ov.classList.add('show');
    }
    function closeFeedback() {
        document.getElementById('feedbackOverlay').classList.remove('show');
        if (_cb) { _cb(); _cb = null; }
    }

    initHeader();
    loadRound();
</script>

<!-- ═══ WATERMARK HAK CIPTA — JANGAN HAPUS ═══ -->
<div id="watermark-zaini-suparlan">✦ by ZAINI SUPARLAN</div>
<!-- ═══════════════════════════════════════════ -->

</body>
</html>
